<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu calendario con fotos</title>
<meta name="theme-color" content="#F4F6F8">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F4F6F8;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a,button{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.logo{width:36px;height:36px;border-radius:10px;background:#2F5BEA;display:flex;align-items:center;justify-content:center}
.back{display:flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;color:#2F5BEA;font-size:14px;font-weight:600;background:none;border:0;cursor:pointer}
h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.5px}
.sub{margin:0;font-size:15px;line-height:1.45;color:#5B6472}
.head{display:flex;flex-direction:column;gap:6px}
.price{font-size:18px;font-weight:700;color:#2F5BEA}
.badge{display:inline-block;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;background:#FFF1CC;color:#7A4B00}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{display:flex;align-items:center;gap:14px;min-height:150px;padding:14px 14px 14px 16px;background:#fff;border:1.5px solid #E5E8ED;border-radius:18px;color:inherit;width:100%;text-align:left;cursor:pointer}
.card:active{border-color:#2F5BEA}
.card .t{font-size:17px;font-weight:700;line-height:1.2}
.card .d{font-size:13.5px;line-height:1.4;color:#5B6472}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.thumb{width:90px;flex:none;display:flex;justify-content:center}
.mini{box-sizing:border-box;padding:6px;border-radius:3px;box-shadow:0 4px 12px rgba(17,24,39,.18);display:flex;flex-direction:column;gap:6px}
.mini .ph{border-radius:2px;background:linear-gradient(135deg,#F6B26B,#F28C8C)}
.mini .ln{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field label span{font-weight:400;color:#5B6472}
input[type=text],input[type=tel],select{height:48px;border:1.5px solid #B8C0CC;border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;color:#111827;background:#fff;width:100%}
select{padding:0 12px}
input.err,select.err{border-color:#C0392B;background:#FFF5F4}
.errmsg{font-size:13px;color:#C0392B;min-height:0}
.note{display:flex;align-items:flex-start;gap:10px;background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4}
.note svg{flex:none;margin-top:1px}
.pill{display:inline-block;border-radius:10px;background:#E3EAFD;color:#1E3FA8;padding:6px 12px;font-size:13px;font-weight:600}
.small{margin:0;font-size:13px;line-height:1.4;color:#5B6472}
.btn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:14px;background:#2F5BEA;color:#fff;font-size:17px;font-weight:600;border:0;width:100%;cursor:pointer}
.btn[disabled]{background:#B8C0CC;cursor:not-allowed}
.btn2{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;background:#fff;border:1.5px solid #2F5BEA;color:#2F5BEA;font-size:15px;font-weight:600;width:100%;cursor:pointer}
.spacer{flex:1}
.designs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.designs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-height:44px}
.opt .m{border-radius:4px;box-sizing:border-box;padding:6px;display:flex;flex-direction:column;gap:6px;border:1px solid #B8C0CC}
.opt.sel .m{box-shadow:0 0 0 2px #F4F6F8,0 0 0 4px #2F5BEA}
.opt span{font-size:13px;font-weight:500;color:#111827}
.opt.sel span{color:#2F5BEA;font-weight:700}
.fhead{display:flex;justify-content:space-between;align-items:baseline}
.fhead b{font-size:15px}.fhead i{font-style:normal;font-size:13px;color:#5B6472}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#E5E8ED;border:0;padding:0}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:rgba(17,24,39,.72);border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.add{border:2px dashed #9AA7C0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#2F5BEA}
.slot .lab{position:absolute;left:0;right:0;bottom:0;background:rgba(17,24,39,.6);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:3px 0}
.slot.empty{border:2px dashed #9AA7C0;background:#fff;color:#5B6472;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;cursor:pointer}
.slot.cover{aspect-ratio:16/9;width:100%}
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -20px;padding-left:20px;padding-right:20px}
.hscroll>*{scroll-snap-align:center;flex:none}
.poster{container-type:inline-size;width:100%;aspect-ratio:32/45;border-radius:4px;box-shadow:0 6px 18px rgba(17,24,39,.22);overflow:hidden;display:flex;flex-direction:column;position:relative}
.poster .pa{position:relative;flex:none;height:38%;margin:4cqw 4cqw 0}
.poster .pa div.c{position:absolute;overflow:hidden;border-radius:.8cqw;background:#ddd}
.poster .pa img{width:100%;height:100%;object-fit:cover;display:block}
.poster .yr{font-weight:800;font-size:8cqw;line-height:1;text-align:left;padding:2.5cqw 4cqw 1.5cqw}
.poster .ms{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw 2.5cqw;padding:0 4cqw 3.5cqw;align-content:space-between}
.mt{font-size:2.6cqw;font-weight:700;text-transform:uppercase;letter-spacing:.1cqw;margin-bottom:.4cqw}
.md{display:grid;grid-template-columns:repeat(7,1fr);font-size:2.2cqw;line-height:1.3;text-align:center}
.md .h{font-weight:700;opacity:.55;font-size:2cqw}.md .s{color:#B23A2E}
.sheet{container-type:inline-size;width:72%;aspect-ratio:32/45;border-radius:4px;box-shadow:0 6px 18px rgba(17,24,39,.22);overflow:hidden;display:flex;flex-direction:column;padding:3cqw 4cqw 4cqw;gap:3cqw}
.sheet .rings{height:3cqw;flex:none;background:radial-gradient(circle at 50% 50%,#6B7280 .9cqw,transparent 1.2cqw) 0 0/5cqw 3cqw repeat-x}
.sheet .ph{flex:1;border-radius:1cqw;overflow:hidden;background:#ddd}
.sheet .ph img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .band{flex:none;border-radius:1cqw;color:#fff;font-weight:800;font-size:9cqw;display:flex;align-items:center;justify-content:center;padding:2cqw 0}
.sheet .cal{flex:none;padding:1cqw 1cqw 0}
.sheet .mt{font-size:4cqw;margin-bottom:1cqw}.sheet .md{font-size:3.4cqw}.sheet .md .h{font-size:3cqw}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.thumbs div{flex:none;width:52px;text-align:center;font-size:11px;color:#5B6472}
.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:8px;display:block;margin-bottom:2px}
.sum{background:#fff;border-radius:12px;padding:4px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #EEF0F3;font-size:14px}
.sum div:last-child{border:0}.sum span:first-child{color:#5B6472}.sum span:last-child{font-weight:600;text-align:right}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.consent input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:#2F5BEA}
.zoom{position:fixed;inset:0;background:rgba(17,24,39,.86);z-index:50;overflow:auto;padding:16px}
.zoom img{display:block;width:900px;max-width:none;margin:40px auto 20px;border-radius:4px}
.zoom button{position:fixed;top:12px;right:12px;height:44px;padding:0 16px;border-radius:12px;border:0;background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.posterimg{display:block;width:100%;aspect-ratio:32/45;border-radius:4px;box-shadow:0 6px 18px rgba(17,24,39,.22);background:#fff}
.posterimg.wait{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#5B6472;font-size:15px}
.spin{width:34px;height:34px;border:4px solid #E5E8ED;border-top-color:#2F5BEA;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.over{position:fixed;inset:0;background:rgba(244,246,248,.96);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center}
.bar{width:100%;max-width:320px;height:10px;border-radius:5px;background:#E5E8ED;overflow:hidden}
.bar i{display:block;height:100%;background:#2F5BEA;width:0;transition:width .2s}
.bad{background:#FFF5F4;border:1.5px solid #E8B4AE;color:#8A2A20;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;max-width:340px}
.ok{width:72px;height:72px;border-radius:50%;background:#DCF5E6;display:flex;align-items:center;justify-content:center;margin:12px auto 4px}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:8px 12px 8px 8px}
.file img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.file .n{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .n small{display:block;font-weight:400;color:#5B6472;font-size:12px}
.file .e{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#1B7F4B}
.toast{position:fixed;left:16px;right:16px;bottom:20px;max-width:440px;margin:0 auto;background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:70}
.center{text-align:center}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const C = window.CONFIG;
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MES3 = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MES_ID = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const SERVICIOS = ["Planta 1","Planta 2","Planta 3","Urgencias","Quirófano","UCI","Otro servicio"];
const CATEGORIAS = ["TCAE","Celador/a","Enfermero/a","Médico/a","Administrativo/a","Otra"];

const PRODUCTOS = {
  quelucha:{id:"quelucha",nombre:"Calendario Que Lucha!",precio:"1 €",badge:"Unidades limitadas",
    desc:"Póster collage con hasta 6 fotos y los 12 meses debajo. Cartulina 300 g, 32 × 45 cm.",
    intro:"Elige el año. Los 12 meses van bajo tu collage, en una cartulina de 300 g de 32 × 45 cm.",
    corto:"Póster collage", tema:{bg:"#F7EFE6",ac:"#C9622E",ln:"#C9B8A5"}, max:6},
  premium:{id:"premium",nombre:"Calendario Póster Premium",precio:"3 €",
    desc:"El mismo póster collage en 3 diseños: ratón, nido y conejo. Cartulina 300 g, 32 × 45 cm.",
    intro:"Elige el diseño y el año. Los 12 meses van bajo tu collage, en una cartulina de 300 g de 32 × 45 cm.",
    corto:"Póster collage", max:6,
    variantes:[{id:"raton",nombre:"Ratón",bg:"#E9EDF4",ac:"#5B6B8C",ln:"#9AA7C0"},
               {id:"nido",nombre:"Nido",bg:"#F3EBDD",ac:"#8A6A3B",ln:"#CDBB9A"},
               {id:"conejo",nombre:"Conejo",bg:"#FBEAF0",ac:"#C2577F",ln:"#E3B4C6"}]},
  "12hojas":{id:"12hojas",nombre:"Calendario de 12 hojas",precio:"12,50 €",
    desc:"Portada y una foto por mes. Cartulina 300 g, 32 × 45 cm, a dos caras, anillado y con colgador.",
    corto:"12 hojas", max:13,
    variantes:[{id:"modelo1",nombre:"Modelo 1",bg:"#F7EFE6",ac:"#C9622E",grad:"linear-gradient(135deg,#F6B26B,#F28C8C)"},
               {id:"modelo2",nombre:"Modelo 2",bg:"#E6F0FF",ac:"#2F5BEA",grad:"linear-gradient(135deg,#7FB2F0,#A9D6F5)"}]}
};

const I = {
  logo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  next:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 6l6 6-6 6"/></svg>',
  info:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  bigcheck:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1B7F4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'
};

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));

// ---------- Estado ----------
function nuevoEstado(){
  return {step:"producto", producto:null, variante:null, anio:C.ANIO_POR_DEFECTO,
    datos:{nombre:"",servicio:"",categoria:"",movil:""}, fotos:[], slots:new Array(13).fill(null),
    consent:true, enviado:null, errores:{}, montaje:null, disp:null};
}
let S = nuevoEstado();
const prod = () => PRODUCTOS[S.producto];
const variante = () => { const p=prod(); return p && p.variantes ? (p.variantes.find(v=>v.id===S.variante)||p.variantes[0]) : null; };
const tema = () => { const p=prod(); return variante() || p.tema; };
const es12 = () => S.producto==="12hojas";

function tituloResumen(){
  const p=prod(); let t = es12() ? "12 hojas" : p.corto;
  t += " · "+S.anio;
  t += es12() ? " · 13 fotos" : " · hasta 6 fotos";
  return t;
}

// ---------- Navegación ----------
const ORDEN = ["producto","config","datos","fotos","previa","gracias"];
function go(step, push){
  S.step = step;
  if(push!==false) history.pushState({step:step},"");
  render(); window.scrollTo(0,0);
}
window.addEventListener("popstate", e=>{
  let st = e.state && e.state.step;
  if(S.enviado){ liberar(); S=nuevoEstado(); st="producto"; }
  if(!st || (st!=="producto" && !S.producto)) st="producto";
  if(st==="gracias") st="producto";
  S.step=st; render();
});
history.replaceState({step:"producto"},"");

// ---------- Utilidades de calendario ----------
function mesHTML(anio, m, opts){
  opts = opts||{};
  const primero = (new Date(anio,m,1).getDay()+6)%7;
  const dias = new Date(anio,m+1,0).getDate();
  let h = '<div><div class="mt" style="color:'+opts.ac+'">'+MESES[m]+'</div><div class="md">';
  if(opts.head) "LMXJVSD".split("").forEach(d=>h+='<span class="h">'+d+'</span>');
  for(let i=0;i<primero;i++) h+='<span>&nbsp;</span>';
  for(let d=1; d<=dias; d++){ const dom=(primero+d-1)%7===6; h+='<span'+(dom?' class="s"':'')+'>'+d+'</span>'; }
  return h+'</div></div>';
}
// ---- Motor de disposición: coloca las fotos en la zona SIN recortar ni deformar, maximizando la cobertura ----
const ZONA_BASE = C.ZONA_FOTOS || {w:29.44, h:17.1};   // cm (se usa en los diseños que aún no tienen plantilla real)
// Diseños con plantilla real. zona = rectángulo de fotos en cm sobre la hoja de 32 x 45. anios = años para los que hay plantilla.
const DISENOS = {
  nido:{producto:"premium", anios:[2027], base:"disenos/nido/base.jpg", marco:"disenos/nido/marco.png", zona:{x:6.527,y:5.131,w:18.959,h:14.325}}
};
function disenoAct(){ const v=variante(); return (prod() && v && DISENOS[v.id] && DISENOS[v.id].producto===prod().id) ? DISENOS[v.id] : null; }
function Z(){ const d=disenoAct(); return d? d.zona : ZONA_BASE; }
const _imgs={};
function cargarImg(src){ if(!_imgs[src]) _imgs[src]=new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>{ delete _imgs[src]; rej(new Error("No se pudo cargar "+src)); }; i.src=src; }); return _imgs[src]; }
const HUECO = C.HUECO_CM!=null ? C.HUECO_CM : 0.3; // cm entre fotos
const PESO_CALIDAD = C.PESO_CALIDAD!=null ? C.PESO_CALIDAD : 0.35;
const PESO_IGUALDAD = C.PESO_IGUALDAD!=null ? C.PESO_IGUALDAD : 0.3; // más alto = fotos más parecidas en tamaño
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function arbol(idx,az){
  if(idx.length===1) return {i:idx[0],ar:null};
  const k=1+Math.floor(az()*(idx.length-1)), c=az()<.5?"V":"H";
  return {c,a:arbol(idx.slice(0,k),az),b:arbol(idx.slice(k),az)};
}
function aspecto(n,fotos){
  if(n.i!=null) return fotos[n.i].pw/fotos[n.i].ph;
  const a=aspecto(n.a,fotos), b=aspecto(n.b,fotos); n.ra=a; n.rb=b;
  return n.c==="V" ? a+b : 1/(1/a+1/b);
}
function colocar(n,x,y,w,h,out){
  if(n.i!=null){ out.push({i:n.i,x,y,w,h}); return; }
  if(n.c==="V"){ const t=n.ra+n.rb, w1=w*n.ra/t; colocar(n.a,x,y,w1,h,out); colocar(n.b,x+w1,y,w-w1,h,out); }
  else { const t=1/n.ra+1/n.rb, h1=h*(1/n.ra)/t; colocar(n.a,x,y,w,h1,out); colocar(n.b,x,y+h1,w,h-h1,out); }
}
function evaluar(n,fotos){
  const ar=aspecto(n,fotos); let w,h;
  if(ar>=Z().w/Z().h){ w=Z().w; h=w/ar; } else { h=Z().h; w=h*ar; }
  const out=[]; colocar(n,(Z().w-w)/2,(Z().h-h)/2,w,h,out);
  let area=0, q=0; const areas=[];
  out.forEach(o=>{ // separación entre fotos y ajuste exacto a la proporción
    const g=HUECO/2, ww=Math.max(o.w-2*g,.1), hh=Math.max(o.h-2*g,.1), r=fotos[o.i].pw/fotos[o.i].ph;
    let fw=ww, fh=ww/r; if(fh>hh){ fh=hh; fw=hh*r; }

    o.ppp=Math.round(fotos[o.i].pw/(fw/2.54)); area+=fw*fh; areas.push(fw*fh); q+=Math.min(1,o.ppp/200);
  });
  const cob=area/(Z().w*Z().h);
  const media=area/areas.length, cv=Math.sqrt(areas.reduce((t,a)=>t+(a-media)*(a-media),0)/areas.length)/media;
  const igualdad=Math.max(0,1-cv);
  return {rects:out, cobertura:cob, score:cob+PESO_CALIDAD*(q/out.length)+PESO_IGUALDAD*igualdad};
}
function generarDisposiciones(fotos){
  const n=fotos.length, idx=fotos.map((_,i)=>i), az=rng(12345+n*7919), vistos={}, lista=[];
  const intentos = n===1?1:12000;
  for(let t=0;t<intentos;t++){
    const o=idx.slice(); for(let i=o.length-1;i>0;i--){ const j=Math.floor(az()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; }
    const ev=evaluar(arbol(o,az),fotos);
    const firma=ev.rects.slice().sort((a,b)=>a.i-b.i).map(q=>Math.round(q.x)+","+Math.round(q.y)+","+Math.round(q.w)+","+Math.round(q.h)).join(";");
    if(vistos[firma]) continue; vistos[firma]=1; lista.push(ev);
  }
  lista.sort((a,b)=>b.score-a.score);

}

function rectRedondo(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

async function componerConDiseno(dis){
  const [bi,mi]=await Promise.all([cargarImg(dis.base),cargarImg(dis.marco)]);
  const W=bi.naturalWidth, H=Math.round(W*45/32), kx=W/32, z=dis.zona;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  g.drawImage(bi,0,0,W,H);
  for(const q of asegurarDisp().rects){
    const bmp=await cargarBitmap(S.fotos[q.i].blob);
    g.drawImage(bmp,(z.x+q.x)*kx,(z.y+q.y)*kx,q.w*kx,q.h*kx);
    if(bmp.close) bmp.close();
  }
  g.drawImage(mi,0,0,W,H);
  const blob=await aBlob(cv,.9); cv.width=cv.height=1;
  if(!blob) throw new Error("No se pudo crear el montaje");
  return blob;
}
async function componerPoster(){
  const dis=disenoAct(); if(dis) return componerConDiseno(dis);
  const t=tema(), W=C.MONTAJE_PX||2400, H=Math.round(W*45/32), u=W/100;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  g.fillStyle=t.bg; g.fillRect(0,0,W,H);
  const FUENTE='system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  const ax=4*u, ay=4*u, aw=92*u, ah=.38*H, kx=aw/ZONA_BASE.w, ky=ah/ZONA_BASE.h;
  for(const q of asegurarDisp().rects){
    const bmp=await cargarBitmap(S.fotos[q.i].blob);
    g.drawImage(bmp,ax+q.x*kx,ay+q.y*ky,q.w*kx,q.h*ky);
    if(bmp.close) bmp.close();
  }
  g.textBaseline="alphabetic"; g.textAlign="left";
  g.fillStyle=t.ac; g.font="800 "+(8*u)+"px "+FUENTE;
  g.fillText(String(S.anio),4*u,ay+ah+2.5*u+7*u);
  const colw=(92-3*2.5)/4*u, gap=2.5*u, top=ay+ah+12*u, fila=2.86*u, bloque=3.5*u+6*fila, disp=H-3.5*u-top, paso=(disp-bloque)/2;
  for(let m=0;m<12;m++){
    const x0=4*u+(m%4)*(colw+gap), y0=top+Math.floor(m/4)*paso;
    g.fillStyle=t.ac; g.font="700 "+(2.6*u)+"px "+FUENTE; g.textAlign="left";
    g.fillText(MESES[m].toUpperCase(),x0,y0+2.6*u);
    const off=(new Date(S.anio,m,1).getDay()+6)%7, dias=new Date(S.anio,m+1,0).getDate(), dw=colw/7;
    g.font="400 "+(2.2*u)+"px "+FUENTE; g.textAlign="center";
    for(let d=1; d<=dias; d++){
      const pos=off+d-1;
      g.fillStyle=(pos%7===6)?"#B23A2E":"#2b2622";
      g.fillText(String(d), x0+(pos%7)*dw+dw/2, y0+3.5*u+(Math.floor(pos/7)+1)*fila-.7*u);
    }
  }
  const blob=await aBlob(cv,.9); cv.width=cv.height=1;

}
let montajeEnCurso=null;
function prepararMontaje(){
  const key=claveMontaje();
  if(S.montaje && S.montaje.key===key) return Promise.resolve();
  if(montajeEnCurso && montajeEnCurso.key===key) return montajeEnCurso.p;
  if(S.montaje && S.montaje.url) URL.revokeObjectURL(S.montaje.url);
  S.montaje=null;
  const p=componerPoster().then(blob=>{ if(claveMontaje()===key) S.montaje={key,blob,url:URL.createObjectURL(blob),mb:(blob.size/1048576).toFixed(1).replace(".",",")+" MB"}; })
    .catch(e=>{ console.error(e); if(claveMontaje()===key) S.montaje={key,fallo:true}; })
    .then(()=>{ montajeEnCurso=null; });
  montajeEnCurso={key,p}; return p;
}

    ? [["Modelo",mod+" · "+S.anio],["Fotos","13 (portada + 12 meses)"],["Impresión","7 hojas, a dos caras"],["Acabado","Anillado y con colgador"],["Papel","Cartulina 300 g · 32 × 45 cm"],["Precio",p.precio]]
    : [["Producto",p.nombre],v?["Diseño",mod]:null,["Año",String(S.anio)],["Fotos",String(n)],["Papel","Cartulina 300 g · 32 × 45 cm"],["Precio",p.precio]].filter(Boolean);
  h+='<div class="sum">'+filas.map(f=>'<div><span>'+f[0]+'</span><span>'+esc(f[1])+'</span></div>').join("")+'</div>';
  h+='<div style="margin-top:auto;display:flex;flex-direction:column;gap:12px"><label class="consent"><input type="checkbox" id="consent"'+(S.consent?" checked":"")+'><span>Acepto el uso de mis fotos para hacer el calendario y que se borren al terminar el pedido.</span></label>'+
     '<button type="button" class="btn" style="margin-top:0" id="enviar" '+((S.consent&&(es12()||S.montaje))?"":"disabled")+'>Confirmar y enviar '+n+' foto'+(n===1?"":"s")+'</button></div>';
  return h;
}
function vGracias(){
  const e=S.enviado;
  let h='<div class="top"><div class="brand"><div class="logo">'+I.logo+'</div><div>'+esc(C.NEGOCIO)+'</div></div></div>';
  h+='<div class="center"><div class="ok">'+I.bigcheck+'</div><h1>¡Gracias, '+esc(e.nombre)+'!</h1>'+
     '<p class="sub" style="margin-top:8px">Hemos recibido tus '+e.nFotos+' foto'+(e.nFotos===1?"":"s")+' y el diseño que has confirmado. Lo revisaremos antes de imprimir.</p>'+
     '<p style="margin:14px 0 0;font-size:14px;color:#5B6472">Tu código de pedido</p><div style="font-size:30px;font-weight:800;letter-spacing:4px;color:#2F5BEA">'+esc(e.codigo)+'</div></div>';
  h+='<div class="files">'+e.items.map(it=>'<div class="file"><img src="'+it.preview+'" alt=""><div class="n">'+esc(it.etq)+'<small>'+esc(it.nombre)+' · '+it.mb+'</small></div><div class="e">'+I.check+'Enviada</div></div>').join("")+'</div>';
  h+='<div style="margin-top:auto;display:flex;flex-direction:column;gap:10px"><button type="button" class="btn2" id="otro">Hacer otro pedido</button><p class="small center">Tus fotos se borrarán cuando tengas tu pedido.</p></div>';
  return h;
}

// ---------- Render + eventos ----------
function render(){
  const app=$("#app"), vistas={producto:vProducto,config:vConfig,datos:vDatos,fotos:vFotos,previa:vPrevia,gracias:vGracias};
  app.innerHTML = vistas[S.step]();
  bind();
}
function bind(){
  $$("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    const dest=b.dataset.go;
    go(dest);
  }));
  $$("[data-prod]").forEach(b=>b.addEventListener("click",()=>{
    if(S.producto!==b.dataset.prod){ S.producto=b.dataset.prod; S.variante=null; S.fotos=[]; S.slots=new Array(13).fill(null); }
    const p=prod(); if(p.variantes && !S.variante) S.variante=p.variantes[0].id;
    go("config");
  }));
  $$("[data-var]").forEach(b=>b.addEventListener("click",()=>{ S.variante=b.dataset.var; render(); }));
  const an=$("#anio"); if(an) an.addEventListener("change",()=>{ S.anio=+an.value; if(S.step==="config") render(); });
  if(S.step==="datos") bindDatos();
  if(S.step==="fotos") bindFotos();
  if(S.step==="previa") bindPrevia();
  if(S.step==="gracias"){ const o=$("#otro"); if(o) o.addEventListener("click",()=>{ liberar(); S=nuevoEstado(); history.replaceState({step:"producto"},""); render(); window.scrollTo(0,0); }); }
}
function bindDatos(){
  const campos=["nombre","servicio","categoria","movil"];
  campos.forEach(k=>{ const el=$("#"+k); el.addEventListener("input",()=>{ S.datos[k]=el.value; el.classList.remove("err"); }); el.addEventListener("change",()=>{ S.datos[k]=el.value; }); });
  $("#sigDatos").addEventListener("click",()=>{
    campos.forEach(k=>S.datos[k]=$("#"+k).value.trim());
    const e={}, d=S.datos;
    if(d.nombre.length<2) e.nombre="Escribe tu nombre.";
    if(!d.servicio) e.servicio="Elige tu servicio.";
    if(!d.categoria) e.categoria="Elige tu categoría.";
    const tel=d.movil.replace(/[\s.\-()]/g,"").replace(/^(\+34|0034)/,"");
    if(!/^[6-9]\d{8}$/.test(tel)) e.movil="Escribe un móvil de 9 cifras.";
    S.errores=e;
    if(Object.keys(e).length){ render(); const f=$(".err"); if(f) f.focus(); return; }
    S.datos.movil=tel; go("fotos");
  });
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }

// ---------- Procesado de fotos ----------
async function cargarBitmap(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file,{imageOrientation:"from-image"}); }catch(e){}
  }
  return await new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("No se pudo leer la imagen"));}; im.src=u; });
}
function aBlob(canvas,q){ return new Promise(r=>canvas.toBlob(r,"image/jpeg",q)); }
async function procesar(file){
  const bmp = await cargarBitmap(file);
  const w0=bmp.width, h0=bmp.height;
  const esc1 = Math.min(1, C.MAX_PX/Math.max(w0,h0));
  const cv=document.createElement("canvas"); cv.width=Math.round(w0*esc1); cv.height=Math.round(h0*esc1);
  const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(bmp,0,0,cv.width,cv.height);
  const blob = await aBlob(cv,C.CALIDAD);
  const pw=cv.width, ph=cv.height;
  const pe = Math.min(1, 700/Math.max(w0,h0));
  const cp=document.createElement("canvas"); cp.width=Math.round(w0*pe); cp.height=Math.round(h0*pe);
  cp.getContext("2d").drawImage(bmp,0,0,cp.width,cp.height);
  const pb = await aBlob(cp,0.8);
  if(bmp.close) bmp.close();
  cv.width=cv.height=cp.width=cp.height=1;
  if(!blob||!pb) throw new Error("No se pudo procesar la foto");
  return {nombre:file.name||"foto.jpg", blob, pw, ph, preview:URL.createObjectURL(pb), mb:(blob.size/1048576).toFixed(1).replace(".",",")+" MB"};
}
function liberar(){ S.fotos.forEach(f=>URL.revokeObjectURL(f.preview)); S.slots.forEach(f=>f&&URL.revokeObjectURL(f.preview)); if(S.montaje&&S.montaje.url) URL.revokeObjectURL(S.montaje.url); if(S.enviado){ S.enviado.items.forEach(i=>URL.revokeObjectURL(i.preview)); } }

async function aniadir(files, slotInicial){
  files = Array.from(files).filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name));
  if(!files.length) return;
  let libres;
  if(es12()){
    libres=[]; const ini = slotInicial==null?0:slotInicial;
    for(let k=0;k<13;k++){ const i=(ini+k)%13; if(k===0 || !S.slots[i]) libres.push(i); }
    if(files.length>libres.length) toast("Solo caben "+libres.length+" fotos más. Hemos usado las primeras.");
  } else {
    const sitio = prod().max - S.fotos.length;
    if(files.length>sitio) toast("Máximo "+prod().max+" fotos. Hemos usado las primeras.");
    files = files.slice(0,Math.max(sitio,0));
  }
  const ov=document.createElement("div"); ov.className="over"; ov.innerHTML='<div style="font-size:17px;font-weight:600" id="ovt">Preparando tus fotos…</div><div class="bar"><i id="ovb"></i></div>'; document.body.appendChild(ov);
  let hechas=0, fallo=0;
  const lote = es12()? files.slice(0,libres.length) : files;
  for(let k=0;k<lote.length;k++){
    try{
      const r = await procesar(lote[k]);
      if(es12()){ const i=libres[k]; if(S.slots[i]) URL.revokeObjectURL(S.slots[i].preview); S.slots[i]=r; } else S.fotos.push(r);
    }catch(e){ fallo++; }
    hechas++; $("#ovb").style.width=Math.round(hechas/lote.length*100)+"%"; $("#ovt").textContent="Preparando tus fotos… "+hechas+" de "+lote.length;
  }
  ov.remove();
  if(fallo) toast(fallo+" foto"+(fallo>1?"s":"")+" no se pudo"+(fallo>1?"ieron":"")+" leer. Prueba con otra.");
  render();
}
function bindFotos(){
  const inp=$("#fileIn"); let slotSel=null;
  inp.addEventListener("change",()=>{ const fs=inp.files; const s=slotSel; slotSel=null; aniadir(fs,s); inp.value=""; });
  const add=$("#addFotos"); if(add) add.addEventListener("click",()=>inp.click());
  $$("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.rm; URL.revokeObjectURL(S.fotos[i].preview); S.fotos.splice(i,1); render(); }));
  $$("[data-slot]").forEach(b=>b.addEventListener("click",e=>{ if(e.target.closest("[data-rmslot]")) return; slotSel=+b.dataset.slot; inp.click(); }));
  $$("[data-rmslot]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); const i=+b.dataset.rmslot; URL.revokeObjectURL(S.slots[i].preview); S.slots[i]=null; render(); }));
  const rep=$("#repetir"); if(rep) rep.addEventListener("click",()=>{
    const llenas=S.slots.map((f,i)=>f?i:-1).filter(i=>i>=0); let k=0;
    for(let i=0;i<13;i++) if(!S.slots[i]){ const o=S.slots[llenas[k%llenas.length]]; S.slots[i]={nombre:o.nombre,blob:o.blob,preview:o.preview,mb:o.mb,copia:true}; k++; }
    render();
  });
  $("#verCal").addEventListener("click",()=>go("previa"));
}

// ---------- Envío ----------
function codigoPedido(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; const r=new Uint8Array(4); crypto.getRandomValues(r); r.forEach(x=>s+=a[x%a.length]); return s; }
async function http(url,opts){
  const r=await fetch(url,opts);
  if(!r.ok){ let t=""; try{t=await r.text();}catch(e){} throw new Error("HTTP "+r.status+" "+t.slice(0,200)); }
  return r;
}
let envio=null;
function bindPrevia(){
  $$("[data-disp]").forEach(b=>b.addEventListener("click",()=>{ const n=S.disp.lista.length; S.disp.idx=(S.disp.idx+(+b.dataset.disp)+n)%n; S.montaje=null; render(); }));
  $$("[data-quitar]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.quitar; URL.revokeObjectURL(S.fotos[i].preview); S.fotos.splice(i,1); S.montaje=null; render(); }));
  const pi=$("#posterImg"); if(pi) pi.addEventListener("click",()=>{ const z=document.createElement("div"); z.className="zoom"; z.innerHTML='<img src="'+S.montaje.url+'" alt=""><button type="button">Cerrar</button>'; z.addEventListener("click",()=>z.remove()); document.body.appendChild(z); });
  const c=$("#consent"); c.addEventListener("change",()=>{ S.consent=c.checked; $("#enviar").disabled=!(c.checked&&(es12()||S.montaje)); });
  if(!es12() && !(S.montaje && S.montaje.key===claveMontaje())){
    prepararMontaje().then(()=>{ if(S.step==="previa") render(); });
  }
  $("#enviar").addEventListener("click",enviar);
}
function listaEnvio(){
  if(es12()) return S.slots.map((f,i)=>({f,etq:i===0?"Portada":MESES[i-1],clave:(i===0?"00-portada":String(i).padStart(2,"0")+"-"+MES_ID[i-1])}));
  return S.fotos.map((f,i)=>({f,etq:"Foto "+(i+1),clave:String(i+1).padStart(2,"0")}));
}
async function enviar(){
  if(!S.consent) return;
  if($("#web") && $("#web").value) return;
  if(!envio) envio={id:crypto.randomUUID(), codigo:codigoPedido(), subidas:{}};
  const lista=listaEnvio(), total=lista.length;
  const ov=document.createElement("div"); ov.className="over";
  document.body.appendChild(ov);
  const pintar=(msg,pct,err)=>{ ov.innerHTML='<div style="font-size:18px;font-weight:700">'+esc(msg)+'</div>'+(err?'':'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="small">No cierres esta pantalla.</div>');
    if(err){ ov.insertAdjacentHTML("beforeend",'<div class="bad">'+esc(err)+'</div><button class="btn" style="max-width:340px;margin:0" id="reint">Reintentar</button><button class="btn2" style="max-width:340px" id="cancel">Volver</button>'); $("#reint").onclick=()=>{ov.remove();enviar();}; $("#cancel").onclick=()=>ov.remove(); } };
  try{
    const montaje = (!es12() && S.montaje && S.montaje.blob) ? S.montaje : null;
    const pasos=total+(montaje?1:0);
    pintar("Enviando tus fotos… 0 de "+total,0);
    const rutas=[]; let n=0, rutaMontaje=null;
    if(montaje){
      rutaMontaje=envio.id+"/montaje.jpg";
      if(!envio.subidas[rutaMontaje]){
        await http(C.SUPABASE_URL+"/storage/v1/object/"+C.BUCKET+"/"+rutaMontaje,{method:"POST",headers:{apikey:C.SUPABASE_KEY,"Content-Type":"image/jpeg","Cache-Control":"3600"},body:montaje.blob});
        envio.subidas[rutaMontaje]=true;
      }
    }
    // Las fotos repetidas (mismo blob) se suben una vez por hueco igualmente: cada hueco = un archivo
    for(const it of lista){
      const ruta=envio.id+"/"+it.clave+".jpg"; rutas.push(ruta);
      if(!envio.subidas[ruta]){
        await http(C.SUPABASE_URL+"/storage/v1/object/"+C.BUCKET+"/"+ruta,{method:"POST",headers:{apikey:C.SUPABASE_KEY,"Content-Type":"image/jpeg","Cache-Control":"3600"},body:it.f.blob});
        envio.subidas[ruta]=true;
      }
      n++; pintar("Enviando tus fotos… "+n+" de "+total, Math.round((n+(montaje?1:0))/pasos*95));
    }
    pintar("Guardando tu pedido…",98);
    const v=variante();
    const fila={id:envio.id,producto:S.producto,modelo:v?v.id:null,anio:S.anio,
      datos:{nombre:S.datos.nombre,servicio:S.datos.servicio,categoria:S.datos.categoria,movil:S.datos.movil,codigo:envio.codigo,n_fotos:total,
             etiquetas:lista.map(i=>i.etq), montaje:rutaMontaje,
             disposicion: es12()?null:{diseno:disenoAct()?variante().id:null,zona_cm:Z(),hueco_cm:HUECO,fotos:S.disp.lista[S.disp.idx].rects.map(q=>({archivo:String(q.i+1).padStart(2,"0")+".jpg",x:+q.x.toFixed(2),y:+q.y.toFixed(2),w:+q.w.toFixed(2),h:+q.h.toFixed(2),ppp:q.ppp}))}},
      fotos:rutas};
    if(!envio.guardado){
      await http(C.SUPABASE_URL+"/rest/v1/pedidos",{method:"POST",headers:{apikey:C.SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(fila)});
      envio.guardado=true;
    }
    // éxito
    const items=lista.map(it=>({etq:it.etq,nombre:it.f.nombre,mb:it.f.mb,preview:it.f.preview}));
    if(montaje) items.unshift({etq:"Tu calendario (montaje)",nombre:"montaje.jpg",mb:montaje.mb,preview:montaje.url});
    S.enviado={nombre:S.datos.nombre,codigo:envio.codigo,items,nFotos:total};
    envio=null; ov.remove();
    // los blobs ya no hacen falta
    S.fotos=[]; S.slots=new Array(13).fill(null); S.montaje=null;
    S.step="gracias"; history.pushState({step:"gracias"},""); render(); window.scrollTo(0,0);
  }catch(err){
    console.error(err);
    const offline = !navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(String(err));
    pintar("No se ha podido enviar", 0, offline ? "Parece que no hay conexión. Revisa tu internet y vuelve a intentarlo. Lo que ya se subió no se pierde." : "Ha ocurrido un error al enviar. Inténtalo de nuevo; si sigue fallando, avísanos. ("+String(err.message||err).slice(0,120)+")");
  }
}

render();
})();
</script>
