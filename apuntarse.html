<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apúntate a la lista ¡Qué lucha!!</title>
<meta name="theme-color" content="#F4F6F8">
<link rel="icon" type="image/png" href="logo/icono.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F4F6F8;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a,button{font-family:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:16px 20px 28px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;min-height:44px}
.brand{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.5px}
.sub{margin:0;font-size:15px;line-height:1.45;color:#5B6472}
.head{display:flex;flex-direction:column;gap:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field label span{font-weight:400;color:#5B6472}
input[type=text],input[type=tel]{height:48px;border:1.5px solid #B8C0CC;border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;color:#111827;background:#fff;width:100%}
input.err{border-color:#C0392B;background:#FFF5F4}
.errmsg{font-size:13px;color:#C0392B}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.consent input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:#13A4AA}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:14px;background:#13A4AA;color:#fff;font-size:17px;font-weight:600;border:0;width:100%;cursor:pointer;text-decoration:none}
.btn[disabled]{background:#B8C0CC;cursor:not-allowed}
.btn.wa{background:#1FA855}
.btn2{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;background:#fff;border:1.5px solid #13A4AA;color:#0B7C82;font-size:15px;font-weight:600;width:100%;cursor:pointer;text-decoration:none}
.note{display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.45}
.pasos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.small{margin:0;font-size:13px;line-height:1.4;color:#5B6472}
.center{text-align:center}
.codigo{font-size:40px;font-weight:800;letter-spacing:8px;color:#0B7C82}
.ok{width:72px;height:72px;border-radius:50%;background:#DCF5E6;display:flex;align-items:center;justify-content:center;margin:8px auto 4px}
.bad{background:#FFF5F4;border:1.5px solid #E8B4AE;color:#8A2A20;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.consent a,.legal a{color:#0B7C82;font-weight:600}
.legal{background:#fff;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;color:#374151}
.legal b{display:block;font-size:13.5px;color:#111827;margin-bottom:4px}
.legal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;width:100%;max-width:640px;max-height:88vh;max-height:88dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:18px}}
.modal .mc{overflow:auto;padding:18px 20px;font-size:14px;line-height:1.5}
.modal h2{font-size:17px;margin:0 0 10px}.modal h3{font-size:14.5px;margin:16px 0 4px}.modal p{margin:0 0 6px}
.modal .mp{padding:12px 20px 16px;border-top:1px solid #E5E8ED}
.ph{background:#FFF1CC;color:#7A4B00;padding:0 4px;border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>document.write('<script src="config.js?v='+Date.now()+'"><\/script>');</script><!-- siempre los ajustes al día -->
<script>
(function(){
"use strict";
const C=window.CONFIG;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const ICO_WA='<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';
const CHECK='<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1B7F4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const cab='<div class="top"><a class="brand" href="./" aria-label="Ir al inicio"><img src="logo/hexagono.png" alt="" style="height:40px;width:auto"><img src="logo/rotulo.png" alt="¡Qué lucha!!" style="height:34px;width:auto"></a></div>';
const numVisible=()=>{ const n=String(C.WHATSAPP||""); return n.length>9 ? "+"+n.slice(0,n.length-9)+" "+n.slice(-9).replace(/(\d{3})(\d{3})(\d{3})/,"$1 $2 $3") : n; };

// Datos del titular para el texto legal (se rellenan en config.js). Si faltan, se ve el hueco marcado.
const RAZON=()=>C.RAZON_SOCIAL?esc(C.RAZON_SOCIAL):'<span class="ph">(Razón social)</span>';
const EMAIL=()=>C.EMAIL_CONTACTO?'<a href="mailto:'+esc(C.EMAIL_CONTACTO)+'">'+esc(C.EMAIL_CONTACTO)+'</a>':'<span class="ph">[TU_EMAIL_DE_CONTACTO]</span>';
function primeraCapa(){
  return '<div class="legal"><b>Información básica sobre Protección de Datos</b><ul>'+
   '<li><strong>Responsable:</strong> ¡Qué lucha!! '+RAZON()+'</li>'+
   '<li><strong>Finalidad:</strong> Gestionar la entrega de tu código de descuento personalizado y el envío posterior de promociones exclusivas a través de WhatsApp.</li>'+
   '<li><strong>Legitimación:</strong> Consentimiento explícito del interesado al marcar la casilla.</li>'+
   '<li><strong>Destinatarios:</strong> Tus datos no se cederán a terceros excepto por obligación legal o soporte técnico del servicio.</li>'+
   '<li><strong>Derechos:</strong> Puedes acceder, rectificar, limitar y suprimir tus datos, así como darte de baja en cualquier momento enviando la palabra BAJA por WhatsApp o escribiendo a nuestro correo de contacto.</li></ul></div>';
}
function segundaCapa(){
  return '<h2>TÉRMINOS Y POLÍTICA DE PRIVACIDAD DEL SERVICIO DE NOVEDADES Y OFERTAS POR WHATSAPP</h2>'+
   '<h3>1. RESPONSABLE DEL TRATAMIENTO DE DATOS</h3><p>El responsable del tratamiento de los datos recogidos a través de este formulario es ¡Qué lucha!! (en adelante, "EL TITULAR"), con domicilio en España. Correo electrónico de contacto para protección de datos: '+EMAIL()+'.</p>'+
   '<h3>2. FINALIDAD Y USO DE LOS DATOS</h3><p>Al completar el formulario con tu Nombre y Número de Teléfono y aceptar estas condiciones, autorizas expresamente a EL TITULAR a:</p><p>a) Generar un código de descuento único y personalizado asignado a tu registro.</p><p>b) Enviarte comunicaciones comerciales, cupones de descuento, novedades y ofertas exclusivas a través de la aplicación de mensajería instantánea WhatsApp.</p>'+
   '<h3>3. LEGITIMACIÓN</h3><p>La base legal para el tratamiento de tus datos es el consentimiento inequívoco y explícito que otorgas al marcar la casilla de verificación en el formulario de registro de la página web.</p>'+
   '<h3>4. DERECHO DE CANCELACIÓN Y BAJA (OPT-OUT)</h3><p>El usuario puede revocar su consentimiento y darse de baja de la lista de difusión en cualquier momento de forma gratuita e inmediata. Para dejar de recibir comunicaciones por WhatsApp, basta con responder a cualquiera de nuestros mensajes con la palabra "BAJA". De forma alternativa, puede solicitar la supresión de sus datos enviando un correo electrónico a '+EMAIL()+'.</p>'+
   '<h3>5. CONSERVACIÓN DE LOS DATOS</h3><p>Los datos personales proporcionados se conservarán mientras el usuario no solicite su supresión o revocación del consentimiento, o hasta que finalice el canal comercial de comunicaciones de EL TITULAR.</p>'+
   '<h3>6. CONDICIONES DE LOS CÓDIGOS DE DESCUENTO</h3><p>- Cada código de descuento generado es personal, alfanumérico, aleatorio y de un único uso por usuario/pedido en la tienda online.</p><p>- Los códigos no son canjeables por dinero en efectivo ni acumulables a otras promociones vigentes salvo que se especifique lo contrario.</p>';
}
function abrirLegal(){
  const m=document.createElement("div"); m.className="modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-label","Política de Privacidad y Condiciones del Servicio");
  m.innerHTML='<div><div class="mc">'+segundaCapa()+'</div><div class="mp"><button type="button" class="btn" style="height:48px">Cerrar</button></div></div>';
  const cerrar=()=>{ m.remove(); document.removeEventListener("keydown",tecla); const l=$("#verLegal"); if(l) l.focus(); };
  const tecla=e=>{ if(e.key==="Escape") cerrar(); };
  m.addEventListener("click",e=>{ if(e.target===m) cerrar(); }); m.querySelector("button").addEventListener("click",cerrar); document.addEventListener("keydown",tecla);
  document.body.appendChild(m); m.querySelector("button").focus();
}

let D={nombre:"",servicio:"",categoria:"",movil:""}, E={}, consent=false, hecho=null, aviso="";

function enlaceWA(nombre,codigo){
  const txt=(C.WA_APUNTARSE||"Hola, soy {nombre}. Autorizo a ¡Qué lucha!! a añadirme a su lista de difusión de WhatsApp. Mi código es {codigo}.").replace(/\{nombre\}/g,nombre).replace(/\{codigo\}/g,codigo);
  return "https://wa.me/"+C.WHATSAPP+"?text="+encodeURIComponent(txt);
}
function vForm(){
  const f=(id,lab,extra,tipo,attrs)=>'<div class="field"><label for="'+id+'">'+lab+(extra?'<span> '+extra+'</span>':'')+'</label><input id="'+id+'" type="'+(tipo||"text")+'" '+(attrs||"")+' value="'+esc(D[id])+'" class="'+(E[id]?"err":"")+'"><div class="errmsg">'+(E[id]||"")+'</div></div>';
  return cab+'<div class="head"><h1>Apúntate a la lista ¡Qué lucha!!</h1><p class="sub">Recibirás nuestras ofertas por WhatsApp y tu código personal para pedir los productos ¡Qué lucha!!.</p></div>'+
   '<div class="note"><ol class="pasos"><li>Rellena tus datos.</li><li>Se abrirá tu WhatsApp con un mensaje ya escrito: pulsa <strong>Enviar</strong>.</li><li>Con tu código ya puedes hacer tu pedido.</li></ol></div>'+
   '<div style="display:flex;flex-direction:column;gap:14px">'+
   f("nombre","Nombre","(sin apellidos)","text",'autocomplete="given-name" maxlength="40"')+
   f("servicio","Servicio","","text",'autocomplete="off" maxlength="60"')+
   f("categoria","Categoría profesional","","text",'autocomplete="off" maxlength="60"')+
   f("movil","Teléfono móvil","(el de tu WhatsApp)","tel",'inputmode="tel" placeholder="6XX XXX XXX" autocomplete="tel" maxlength="20"')+
   '<input class="hp" type="text" id="web" tabindex="-1" autocomplete="off" aria-hidden="true"></div>'+
   (aviso?'<div class="bad">'+aviso+'</div>':'')+
   '<label class="consent"><input type="checkbox" id="consent"'+(consent?" checked":"")+'><span>He leído y acepto la <a href="#" id="verLegal">Política de Privacidad y Condiciones del Servicio</a> y doy mi consentimiento explícito para recibir ofertas comerciales y códigos de descuento a través de mi número de WhatsApp.</span></label>'+primeraCapa()+''+
   '<button type="button" class="btn" id="ir"'+(consent?"":" disabled")+'>'+ICO_WA+'Apuntarme</button>';
}
function vHecho(){
  const h=hecho;
  return cab+'<div class="center"><div class="ok">'+CHECK+'</div><h1>¡Ya casi, '+esc(h.nombre)+'!</h1>'+
   '<p style="margin:14px 0 0;font-size:14px;color:#5B6472">Tu código personal</p><div class="codigo">'+esc(h.codigo)+'</div>'+
   '<p class="small">Guárdalo: lo necesitas para pedir. Solo sirve con tu móvil.</p></div>'+
   '<div class="note" style="border:1.5px solid #25D366"><div><strong>Último paso:</strong> envíanos el WhatsApp que se ha abierto para autorizarnos a añadirte a la lista. Si no se ha abierto, pulsa el botón.</div>'+
   '<a class="btn wa" id="wa" href="'+esc(h.wa)+'">'+ICO_WA+'Enviar por WhatsApp</a></div>'+
   '<div class="note"><div><strong>Importante:</strong> guarda nuestro número <strong>'+esc(numVisible())+'</strong> en tus contactos. Si no lo guardas, WhatsApp no te enviará nuestras ofertas.</div></div>'+
   '<a class="btn2" href="pedir.html">Hacer mi pedido ahora</a>';
}
function render(){
  $("#app").innerHTML = hecho ? vHecho() : vForm();
  if(hecho) return;
  ["nombre","servicio","categoria","movil"].forEach(k=>{ const el=$("#"+k); el.addEventListener("input",()=>{ D[k]=el.value; el.classList.remove("err"); }); });
  const c=$("#consent"); c.addEventListener("change",()=>{ consent=c.checked; $("#ir").disabled=!consent; });
  $("#verLegal").addEventListener("click",e=>{ e.preventDefault(); abrirLegal(); });
  $("#ir").addEventListener("click",enviar);
}
async function enviar(){
  if(!consent || $("#web").value) return;
  ["nombre","servicio","categoria","movil"].forEach(k=>D[k]=$("#"+k).value.trim());
  E={}; aviso="";
  if(D.nombre.length<2) E.nombre="Escribe tu nombre.";
  if(D.servicio.length<2) E.servicio="Escribe tu servicio.";
  if(D.categoria.length<2) E.categoria="Escribe tu categoría profesional.";
  const tel=D.movil.replace(/[\s.\-()]/g,"").replace(/^(\+34|0034)/,"");
  if(!/^[6-9]\d{8}$/.test(tel)) E.movil="Escribe un móvil de 9 cifras.";
  if(Object.keys(E).length){ render(); const f=document.querySelector(".err"); if(f) f.focus(); return; }
  const b=$("#ir"); b.disabled=true; b.textContent="Apuntándote…";
  let res;
  try{
    const r=await fetch(C.SUPABASE_URL+"/rest/v1/rpc/apuntarse",{method:"POST",headers:{apikey:C.SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_nombre:D.nombre,p_servicio:D.servicio,p_categoria:D.categoria,p_movil:tel})});
    if(!r.ok) throw new Error("HTTP "+r.status);
    res=await r.json();
  }catch(e){ aviso="No se ha podido completar. Revisa tu conexión e inténtalo de nuevo."; render(); return; }
  if(res==="existe"){ aviso='Este móvil ya está apuntado a la lista. Si no recuerdas tu código, <a href="'+esc("https://wa.me/"+C.WHATSAPP+"?text="+encodeURIComponent("Hola, soy "+D.nombre+". Ya estoy apuntado a la lista pero no recuerdo mi código."))+'" style="color:#8A2A20;font-weight:700">escríbenos por WhatsApp</a>.'; render(); return; }
  if(!/^[A-Z0-9]{4}$/.test(String(res))){ aviso="Revisa tus datos e inténtalo de nuevo."; render(); return; }
  hecho={nombre:D.nombre,codigo:res,wa:enlaceWA(D.nombre,res)};
  try{ localStorage.setItem("ql_lista",JSON.stringify({codigo:res,movil:tel,nombre:D.nombre,servicio:D.servicio,categoria:D.categoria})); }catch(e){}
  render(); window.scrollTo(0,0);
  setTimeout(()=>{ location.href=hecho.wa; },600); // abre su WhatsApp con el mensaje ya escrito
}
render();
})();
</script>
</body>
</html>
