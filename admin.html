<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de pedidos</title>
<link rel="icon" type="image/png" href="logo/icono.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F4F6F8;color:#111827;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
.bar{background:#fff;border-bottom:1px solid #E5E8ED}
.bar>div{max-width:1216px;margin:0 auto;padding:12px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:36px;height:36px;border-radius:10px;background:#13A4AA;display:flex;align-items:center;justify-content:center}
.brand b{display:block;font-size:15px;font-weight:600}.brand span{font-size:13px;color:#5B6472}
nav{display:flex;gap:6px}
nav a,nav button{display:flex;align-items:center;height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:600;color:#374151;background:transparent;border:0}
nav a.on{background:#DDF1F3;color:#0B6970}
main{max-width:1216px;margin:0 auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.5px}
h2{margin:0 0 10px;font-size:16px}
.sub{margin:0;font-size:15px;color:#5B6472}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.cnt{display:flex;flex-wrap:wrap;gap:10px}
.cnt button{border:2px solid transparent;border-radius:12px;padding:8px 14px;font-size:14px;font-family:inherit;cursor:pointer}.cnt button[aria-pressed=true]{border-color:currentColor;box-shadow:0 0 0 2px #fff inset}.cnt strong{font-size:18px}
.busq{width:100%;height:46px;border:1.5px solid #D0D5DD;border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;background:#fff}
.tr.sel{grid-template-columns:34px 56px 1.3fr 1.5fr 50px 92px 100px 165px 84px;cursor:pointer}
.acc{display:flex;flex-direction:column;gap:6px}.acc button{height:30px;padding:0 8px;border-radius:8px;border:1.5px solid #D0D5DD;background:#fff;font-size:12.5px;font-weight:600;color:#374151;cursor:pointer;font-family:inherit}.acc button.del{color:#B42318;border-color:#E8B4AE}.tr.sel:not(.th):hover{background:#F9FAFB}
.ck{display:flex;align-items:center}.ck input{width:20px;height:20px;accent-color:#13A4AA}
.lote{position:sticky;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#0C2B4B;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}.lote[hidden]{display:none}.lote .b{height:38px;padding:0 14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{height:40px;padding:0 16px;border-radius:10px;border:1.5px solid #D0D5DD;background:#fff;font-size:14px;font-weight:600;color:#374151}
.seg button[aria-pressed=true]{background:#13A4AA;border-color:#13A4AA;color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
.tbl{background:#fff;border:1px solid #E5E8ED;border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:70px 1.3fr 1.6fr 60px 100px 110px 170px;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid #EEF0F3;font-size:14px}
.tr:last-child{border:0}
.th{background:#F9FAFB;font-size:12px;font-weight:700;color:#5B6472;text-transform:uppercase;letter-spacing:.3px}
a.tr:hover{background:#F4F7FF}
.sm{font-size:12.5px;color:#5B6472}
.pill{display:inline-block;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.empty{padding:36px;text-align:center;color:#5B6472}
.card{background:#fff;border:1px solid #E5E8ED;border-radius:14px;padding:18px 20px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #F0F2F5;font-size:14px}.kv:last-child{border:0}
.kv span:first-child{color:#5B6472}.kv span:last-child{font-weight:600;text-align:right}
.ph{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #F0F2F5}.ph:last-child{border:0}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:10px;background:#E5E8ED;flex:none;cursor:zoom-in}
.ph .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:600}
.ph .t small{font-weight:400;color:#5B6472}
.b{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid #D0D5DD;background:#fff;font-size:14px;font-weight:600;color:#374151}
.b.ok[aria-pressed=true]{background:#DDF3E6;border-color:#2E9E5B;color:#14532D}
.b.no[aria-pressed=true]{background:#FDE7E4;border-color:#D4574A;color:#8A2A20}
.b.pri{background:#13A4AA;border-color:#13A4AA;color:#fff;width:100%;height:48px;font-size:15px}
.b.pri[disabled]{background:#B8C0CC;border-color:#B8C0CC;cursor:not-allowed}
.b.full{width:100%}
.steps{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px}
.steps .m{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#E5E8ED;color:#5B6472}
.steps .done .m{background:#2E9E5B;color:#fff}.steps .cur .m{background:#13A4AA;color:#fff}.steps .cur{font-weight:700}
.back{display:inline-flex;align-items:center;gap:6px;color:#0B7C82;font-weight:600;font-size:14px;height:36px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:5px}
input,select{height:42px;border:1.5px solid #B8C0CC;border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;background:#fff;width:100%}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;flex:1}
.login{max-width:380px;margin:12vh auto;padding:28px;display:flex;flex-direction:column;gap:14px}
.err{color:#B42318;font-size:14px}
.big{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
canvas#prev{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 6px 18px rgba(17,24,39,.22);background:#fff}
.q{display:grid;grid-template-columns:1fr 70px 100px;gap:8px;font-size:14px;padding:6px 0;border-bottom:1px solid #F0F2F5}
.warn{display:flex;gap:10px;background:#FFF1CC;color:#7A4B00;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.zoom{position:fixed;inset:0;background:rgba(17,24,39,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:70}
@media(max-width:560px){nav{flex-wrap:wrap;gap:2px;width:100%;justify-content:space-between}nav a,nav button{padding:0 9px}}
@media(max-width:900px){.cols,.big{grid-template-columns:minmax(0,1fr)}.cols>*,.big>*{min-width:0}main,.bar>div{padding-left:16px;padding-right:16px}}
@media(max-width:760px){
  .tr.th{display:none}
  .tr{grid-template-columns:52px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:start}
  .tr>:nth-child(1){grid-column:1;grid-row:1 / span 2}
  .tr>:nth-child(2){grid-column:2;grid-row:1;min-width:0}
  .tr>:nth-child(3){grid-column:2;grid-row:2;min-width:0}
  .tr>:nth-child(4),.tr>:nth-child(5){display:none}
  .tr>:nth-child(6){grid-column:3;grid-row:1;justify-self:end}
  .tr>:nth-child(7){grid-column:3;grid-row:2;justify-self:end}
  .top{flex-direction:column;align-items:flex-start;gap:12px}
}
@media(max-width:760px){
  .tr.sel{grid-template-columns:30px 40px minmax(0,1fr) auto}
  .tr.sel>:nth-child(1){grid-column:1;grid-row:1 / span 2}
  .tr.sel>:nth-child(2){grid-column:2;grid-row:1 / span 2}
  .tr.sel>:nth-child(3){grid-column:3;grid-row:1;min-width:0}
  .tr.sel>:nth-child(4){display:block;grid-column:3;grid-row:2;min-width:0}
  .tr.sel>:nth-child(5),.tr.sel>:nth-child(6){display:none}
  .tr.sel>:nth-child(7){grid-column:4;grid-row:2;justify-self:end}
  .tr.sel>:nth-child(8){grid-column:4;grid-row:1;justify-self:end}
  .tr.sel>:nth-child(9){grid-column:3 / span 2;grid-row:3;justify-self:end}.acc{flex-direction:row}.acc button{height:34px;padding:0 14px}
  .cnt button{flex:1 1 40%}
}
</style>
</head>
<body>
<div id="root"></div>
<script>document.write('<script src="config.js?v='+Date.now()+'"><\/script>');</script><!-- siempre los ajustes al día -->
<script src="textos.js"></script>
<script>
(function(){
"use strict";
const C=window.CONFIG, BASE=C.SUPABASE_URL, KEY=C.SUPABASE_KEY;
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PRODUCTOS={quelucha:{n:1,nombre:"Calendario Que Lucha!",corto:"Que Lucha!",precio:"1 €",tam:"Cartulina 300 g · 32 × 45 cm"},
  premium:{n:2,nombre:"Calendario Póster Premium",corto:"Póster Premium",precio:"3 €",tam:"Cartulina 300 g · 32 × 45 cm"},
  "12hojas":{n:3,nombre:"Calendario de 12 hojas",corto:"12 hojas",precio:"12,50 €",tam:"Cartulina 300 g · 32 × 45 cm · 7 hojas a dos caras"},
  cojin:{n:4,nombre:"Cojín personalizado",corto:"Cojín",precio:"19,50 €",tam:"Impresión 29 × 29 cm · 200 ppp"}};
// Diseños con texto (textos.js): cojines, etc.
const TXD=(window.QLTextos&&QLTextos.DISENOS)||{};
const esTexto=p=>!!TXD[p.modelo]&&TXD[p.modelo].producto===p.producto;
const MODELOS={raton:"Ratón",nido:"Nido",conejo:"Conejo",modelo1:"Modelo 1",modelo2:"Modelo 2"};
Object.values((window.QLTextos&&QLTextos.DISENOS)||{}).forEach(d=>{ MODELOS[d.id]=d.corto; });
const SIT={rev:["Por revisar fotos","#FFF1CC","#7A4B00"],listo:["Listo para imprimir","#E3EAFD","#1E3FA8"],imp:["Impreso","#EDE7FB","#4C2A9A"],ent:["Entregado","#DDF3E6","#14532D"]};
const ORDEN=["rev","listo","imp","ent"];
const SIGUIENTE={rev:"Marcar fotos como revisadas",listo:"Marcar como impreso",imp:"Marcar como entregado"};
// Plantillas a resolución de impresión (200 ppp) para el archivo final
const PLANTILLAS={conejo:{base:"disenos/conejo/base_full.jpg",marco:"disenos/conejo/marco_full.png"},raton:{base:"disenos/raton/base_full.jpg",marco:"disenos/raton/marco_full.png"},quelucha:{base:"disenos/quelucha/base_full.jpg",marco:null},nido:{base:"disenos/nido/base_full.jpg",marco:"disenos/nido/marco_full.png"}};
const I={logo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>',
 back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
 print:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>'};

// ---------- Sesión ----------
let ses=null; try{ ses=JSON.parse(localStorage.getItem("ql_ses")||"null"); }catch(e){}
function guardar(j){ ses={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000}; try{localStorage.setItem("ql_ses",JSON.stringify(ses));}catch(e){} }
function salir(){ ses=null; try{localStorage.removeItem("ql_ses");}catch(e){} pedidos=[]; pintar(); }
async function tokenReq(tipo,body){
  const r=await fetch(BASE+"/auth/v1/token?grant_type="+tipo,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error_description||j.msg||"No se pudo entrar"); return j;
}
async function refrescar(){ if(!ses) throw new Error("Sin sesión"); try{ guardar(await tokenReq("refresh_token",{refresh_token:ses.refresh})); }catch(e){ salir(); throw new Error("La sesión ha caducado. Vuelve a entrar."); } }
async function api(path,opts,reintento){
  opts=opts||{}; if(!ses) throw new Error("Sin sesión");
  if(Date.now()>ses.exp) await refrescar();
  const h=Object.assign({apikey:KEY,Authorization:"Bearer "+ses.access},opts.headers||{});
  const r=await fetch(BASE+path,Object.assign({},opts,{headers:h}));
  if(r.status===401 && reintento!==false){ await refrescar(); return api(path,opts,false); }
  if(!r.ok){ let t=""; try{t=await r.text();}catch(e){} throw new Error("Error "+r.status+": "+t.slice(0,160)); }
  return r;
}

// ---------- Datos ----------
let pedidos=[], cargando=false, errorCarga="";
let apuntados=[], errApu="";
async function cargarApuntados(){
  errApu=""; try{ apuntados=await (await api("/rest/v1/apuntados?select=*&order=creado.desc&limit=5000")).json(); }
  catch(e){ apuntados=[]; errApu=/404|PGRST205|apuntados/.test(e.message)?"Falta ejecutar supabase_lista.sql en Supabase (una sola vez).":e.message; }
}
const apuDe=p=>{ const c=p.datos&&p.datos.acceso; return c?apuntados.find(a=>a.codigo===c):null; };
const porAnadir=()=>apuntados.filter(a=>!a.en_lista).length;
async function cargar(){
  cargando=true; errorCarga=""; pintar();
  try{ const r=await api("/rest/v1/pedidos?select=*&order=creado.desc&limit=2000"); pedidos=await r.json(); }
  catch(e){ errorCarga=e.message; }
  await cargarApuntados();
  cargando=false; pintar();
}
async function guardarCambios(p,cambios){
  Object.assign(p,cambios);
  try{ await api("/rest/v1/pedidos?id=eq."+p.id,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(cambios)}); }
  catch(e){ aviso("No se pudo guardar: "+e.message); await cargar(); }
  pintar();
}
function aviso(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),4500); }
const fecha=s=>new Date(s).toLocaleDateString("es-ES");
const detalle=p=>(p.producto==="quelucha"?"Único":(MODELOS[p.modelo]||p.modelo||""))+(p.anio?" · "+p.anio:"");
const pill=(bg,fg,t)=>'<span class="pill" style="background:'+bg+';color:'+fg+'">'+t+'</span>';
const pPago=p=>p.pagado?pill("#DDF3E6","#14532D","Pagado"):pill("#FFF1CC","#7A4B00","Sin pagar");
const pSit=p=>{ if(p.anulado) return pill("#E5E7EB","#374151","Anulado"); const s=SIT[p.situacion]||SIT.rev; return pill(s[1],s[2],(esTexto(p)&&p.situacion==="rev")?"Por revisar":s[0]); };
const nFotos=p=>(p.datos&&p.datos.n_fotos)||(p.fotos||[]).length;
const DIAS_ESTANCADO=3;
const dias=p=>Math.floor((Date.now()-new Date(p.creado).getTime())/864e5);
const estancado=p=>!p.anulado&&p.situacion!=="ent"&&dias(p)>=DIAS_ESTANCADO;
const sinLista=p=>{ if(p.anulado) return false; const a=apuDe(p); return !!a&&!a.en_lista; };
let marcados=new Set();
function fila(p,conCk){
  const d=p.datos||{};
  const ini=conCk?'<div class="tr sel" data-n="'+p.numero+'" tabindex="0"><span class="ck"><input type="checkbox"'+(marcados.has(p.numero)?" checked":"")+' aria-label="Seleccionar pedido '+p.numero+'"></span>':'<a class="tr" href="#/pedido/'+p.numero+'">';
  return ini+'<span style="font-weight:700">'+p.numero+'</span>'+
   '<span><div style="font-weight:600">'+esc(d.nombre)+'</div><div class="sm">'+esc(d.servicio)+' · '+esc(d.categoria)+'</div>'+(d.movil?'<div class="sm" style="white-space:nowrap">📞 '+esc(d.movil)+'</div>':'')+'</span>'+
   '<span><div style="font-weight:600">'+(PRODUCTOS[p.producto]?PRODUCTOS[p.producto].n+" · "+PRODUCTOS[p.producto].corto:esc(p.producto))+'</div><div class="sm">'+esc(detalle(p))+'</div></span>'+
   '<span>'+nFotos(p)+'</span><span>'+fecha(p.creado)+'</span><span>'+pPago(p)+'</span><span>'+pSit(p)+(sinLista(p)?'<div class="sm" style="color:#7A4B00;font-weight:700;margin-top:3px">📱 Sin confirmar en la lista</div>':'')+(estancado(p)?'<div class="sm" style="color:#B42318;font-weight:700;margin-top:3px">⏳ '+dias(p)+' días parado</div>':'')+'</span>'+(conCk?'<span class="acc"><button type="button" data-an="'+p.numero+'">'+(p.anulado?'Recuperar':'Anular')+'</button><button type="button" class="del" data-bo="'+p.numero+'">Borrar</button></span></div>':'</a>');
}
const cab='<div class="tr th"><span>Nº</span><span>Cliente</span><span>Calendario</span><span>Fotos</span><span>Fecha</span><span>Pago</span><span>Situación</span></div>';
const cabSel=cab.replace('class="tr th">','class="tr th sel"><span class="ck"><input type="checkbox" id="todos" aria-label="Seleccionar todos"></span>').replace('<span>Situación</span></div>','<span>Situación</span><span></span></div>');

// ---------- Estructura ----------
function barra(ruta){
  return '<div class="bar"><div><div class="brand"><img src="logo/hexagono.png" alt="" style="height:40px;width:auto"><img src="logo/rotulo.png" alt="¡Qué lucha!!" style="height:34px;width:auto"><div><span>Panel de pedidos</span></div></div>'+
   '<nav><a href="#/" class="'+(ruta!=="buscar"&&ruta!=="ajustes"&&ruta!=="lista"?"on":"")+'">Pedidos</a><a href="#/buscar" class="'+(ruta==="buscar"?"on":"")+'">Buscar</a><a href="#/lista" class="'+(ruta==="lista"?"on":"")+'">Lista'+(porAnadir()?' <span class="pill" style="background:#FFF1CC;color:#7A4B00;margin-left:6px;padding:2px 8px">'+porAnadir()+'</span>':'')+'</a><a href="#/ajustes" class="'+(ruta==="ajustes"?"on":"")+'">Ajustes</a><button id="salir" type="button">Salir</button></nav></div></div>';
}
const root=$("#root");
let vistaGrupo="pend", filtroProd="";
const F={nombre:"",tel:"",serv:"",prof:"",cat:"",pago:"",st:"",desde:"",hasta:""};

function ruta(){ const h=location.hash.replace(/^#\/?/,""); const p=h.split("/"); return {r:p[0]||"",id:p[1]}; }
function pintar(){
  if(!ses){ return pintarLogin(); }
  const R=ruta();
  if(R.r==="pedido") return pintarFicha(+R.id);
  if(R.r==="imprimir") return pintarImprimir(+R.id);
  if(R.r==="buscar") return pintarBuscar();
  if(R.r==="ajustes") return pintarAjustes();
  if(R.r==="lista") return pintarApuntados();
  return pintarLista();
}
function estado(){ return cargando?'<div class="empty">Cargando pedidos…</div>':(errorCarga?'<div class="empty" style="color:#B42318">'+esc(errorCarga)+'<br><br><button class="b" id="reint">Reintentar</button></div>':""); }
function enlazarComun(){ const s=$("#salir"); if(s) s.onclick=salir; const r=$("#reint"); if(r) r.onclick=cargar; }

function pintarLogin(){
  root.innerHTML='<div class="card login"><div class="brand"><img src="logo/hexagono.png" alt="" style="height:40px;width:auto"><img src="logo/rotulo.png" alt="¡Qué lucha!!" style="height:34px;width:auto"><div><span>Panel de pedidos</span></div></div>'+
   '<div><label for="em">Correo</label><input id="em" type="email" autocomplete="username"></div><div><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>'+
   '<div class="err" id="le"></div><button class="b pri" id="ent" type="button">Entrar</button></div>';
  const go=async()=>{ $("#le").textContent=""; try{ guardar(await tokenReq("password",{email:$("#em").value.trim(),password:$("#pw").value})); await cargar(); }catch(e){ $("#le").textContent=e.message==="Invalid login credentials"?"Correo o contraseña incorrectos.":e.message; } };
  $("#ent").onclick=go; $("#pw").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

let filtroEst="", busq="";
const predEst={rev:p=>!p.anulado&&p.situacion==="rev",listo:p=>!p.anulado&&p.situacion==="listo",imp:p=>!p.anulado&&p.situacion==="imp",sin:p=>!p.anulado&&!p.pagado,estancado:estancado,sinlista:sinLista};
const normT=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function listaVisible(){
  const q=normT(busq.trim()).replace(/^#/,"");
  let l;
  if(filtroEst) l=pedidos.filter(predEst[filtroEst]);
  else if(q) l=pedidos.slice();
  else l=pedidos.filter(p=>vistaGrupo==="anul"?!!p.anulado:(!p.anulado&&(vistaGrupo==="pend"?p.situacion!=="ent":p.situacion==="ent")));
  if(filtroProd) l=l.filter(p=>p.producto===filtroProd);
  if(q) l=l.filter(p=>{ const d=p.datos||{}; return String(p.numero).includes(q)||normT(d.nombre).includes(q)||normT(d.servicio).includes(q)||normT(d.categoria).includes(q)||normT(d.codigo).includes(q)||normT(d.acceso).includes(q); });
  return l;
}
function pintarTabla(){
  const l=listaVisible();
  const vis=new Set(l.map(p=>p.numero)); marcados=new Set([...marcados].filter(n=>vis.has(n)));
  $("#tbl").innerHTML=(l.length&&!cargando&&!errorCarga?cabSel:cab)+estado()+(!cargando&&!errorCarga?(l.length?l.map(p=>fila(p,true)).join(""):'<div class="empty">No hay pedidos con ese filtro.</div>'):"");
  const nota=$("#nota"); if(nota) nota.textContent=filtroEst||busq.trim()?(l.length+" pedido"+(l.length===1?"":"s")+(busq.trim()&&!filtroEst?" · buscando en todos los pedidos":"")):"";
  enlazarComun(); pintarLote();
  const todos=$("#todos"); if(todos){ todos.checked=l.length>0&&l.every(p=>marcados.has(p.numero)); todos.onchange=()=>{ marcados=todos.checked?new Set(l.map(p=>p.numero)):new Set(); pintarTabla(); }; }
}
function pintarLote(){
  const b=$("#lote"); if(!b) return;
  const n=marcados.size; b.hidden=!n;
  if(n) b.innerHTML='<strong>'+n+' seleccionado'+(n===1?"":"s")+'</strong><button class="b" data-l="rev">Fotos revisadas</button><button class="b" data-l="listo">Impreso</button><button class="b" data-l="imp">Entregado</button><button class="b" data-l="pago">Pagado</button>'+(vistaGrupo==="anul"&&!filtroEst?'<button class="b" data-l="recuperar">Recuperar</button>':'<button class="b" data-l="anular">Anular</button>')+'<button class="b" data-l="borrar" style="color:#B42318;border-color:#E8B4AE">Borrar</button><button class="b" data-l="no">Quitar selección</button>';
  b.querySelectorAll("[data-l]").forEach(x=>x.onclick=()=>lote(x.dataset.l));
}
async function lote(acc){
  if(acc==="no"){ marcados=new Set(); return pintarTabla(); }
  if(acc==="borrar"){ const sel=pedidos.filter(p=>marcados.has(p.numero)); if(await borrarPedidos(sel)) marcados=new Set(); return pintar(); }
  if(acc==="anular"||acc==="recuperar"){
    const an=acc==="anular", sel=pedidos.filter(p=>marcados.has(p.numero)&&(an?!p.anulado:!!p.anulado));
    if(!sel.length){ aviso("Ninguno de los seleccionados necesita ese cambio."); return; }
    if(!confirm(an?"¿Anular "+sel.length+" pedido"+(sel.length===1?"":"s")+"? Dejarán de contar para el límite y esos móviles podrán volver a pedir. Se puede deshacer.":"¿Recuperar "+sel.length+" pedido"+(sel.length===1?"":"s")+"?")) return;
    if(await anularPedidos(sel,an)) marcados=new Set(); return pintar();
  }
  const def={rev:["listo",p=>p.situacion==="rev","revisadas (listos para imprimir)"],listo:["imp",p=>p.situacion==="listo","impresos"],imp:["ent",p=>p.situacion==="imp","entregados"]};
  let cambios,filtro,txt;
  if(acc==="pago"){ cambios={pagado:true}; filtro=p=>!p.pagado; txt="pagados"; }
  else { cambios={situacion:def[acc][0]}; filtro=def[acc][1]; txt=def[acc][2]; }
  const sel=pedidos.filter(p=>marcados.has(p.numero)&&filtro(p));
  if(!sel.length){ aviso("Ninguno de los seleccionados necesita ese cambio."); return; }
  const omit=marcados.size-sel.length;
  if(!confirm("¿Marcar "+sel.length+" pedido"+(sel.length===1?"":"s")+" como "+txt+"?"+(omit?"\n("+omit+" de los seleccionados no se tocan porque no están en el paso anterior.)":""))) return;
  try{ await api("/rest/v1/pedidos?id=in.("+sel.map(p=>p.id).join(",")+")",{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(cambios)}); sel.forEach(p=>Object.assign(p,cambios)); aviso(sel.length+" pedido"+(sel.length===1?"":"s")+" actualizado"+(sel.length===1?"":"s")+"."); marcados=new Set(); }
  catch(e){ aviso("No se pudo guardar: "+e.message); await cargar(); return; }
  pintarLista();
}
// ---------- Anular y borrar ----------
async function anularPedidos(sel,an){
  const v=an?new Date().toISOString():null;
  try{ await api("/rest/v1/pedidos?id=in.("+sel.map(p=>p.id).join(",")+")",{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({anulado:v})}); sel.forEach(p=>p.anulado=v); aviso(sel.length+" pedido"+(sel.length===1?"":"s")+(an?" anulado":" recuperado")+(sel.length===1?"":"s")+"."); return true; }
  catch(e){ aviso("No se pudo guardar: "+e.message+(/anulado/.test(e.message)?" (falta ejecutar supabase_lista.sql)":"")); return false; }
}
async function borrarPedidos(sel,rapido){
  if(!sel.length) return false;
  const nums=sel.map(p=>p.numero).join(", ");
  if(rapido){ if(!confirm("¿BORRAR DEL TODO el pedido "+nums+" de "+((sel[0].datos||{}).nombre||"")+", con sus fotos? No se puede deshacer.\n\nSi es un pedido real cancelado, mejor usa Anular.")) return false; }
  else {
  const t=prompt((sel.length===1?"Vas a BORRAR DEL TODO el pedido "+nums:"Vas a BORRAR DEL TODO "+sel.length+" pedidos ("+nums+")")+", con sus fotos. No se puede deshacer.\n\nSi es un pedido real cancelado, mejor usa Anular.\n\nPara confirmar, escribe "+(sel.length===1?"el número del pedido ("+sel[0].numero+")":"BORRAR")+":");
  if(t==null) return false;
  if(sel.length===1?t.trim()!==String(sel[0].numero):t.trim().toUpperCase()!=="BORRAR"){ aviso("No coincide. No se ha borrado nada."); return false; }
  }
  try{
    const rutas=[].concat(...sel.map(p=>(p.fotos||[]).concat(p.datos&&p.datos.montaje?[p.datos.montaje]:[])));
    for(let i=0;i<rutas.length;i+=500) await api("/storage/v1/object/"+C.BUCKET,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({prefixes:rutas.slice(i,i+500)})});
    await api("/rest/v1/pedidos?id=in.("+sel.map(p=>p.id).join(",")+")",{method:"DELETE",headers:{Prefer:"return=minimal"}});
    const ids=new Set(sel.map(p=>p.id)); pedidos=pedidos.filter(p=>!ids.has(p.id));
    aviso(sel.length===1?"Pedido "+nums+" borrado.":sel.length+" pedidos borrados.");
    return true;
  }catch(e){ aviso("No se pudo borrar: "+e.message); await cargar(); return false; }
}

// PNG con la resolución anotada (200 ppp = 7874 píxeles por metro) para que los programas lo abran a 32 × 45 cm
async function pngA200(cv){
  const u=new Uint8Array(await (await aBlob(cv,"image/png")).arrayBuffer());
  const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; }
  const crc=b=>{ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=t[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const ch=new Uint8Array(21), v=new DataView(ch.buffer); v.setUint32(0,9); ch.set([112,72,89,115],4); v.setUint32(8,7874); v.setUint32(12,7874); ch[16]=1; v.setUint32(17,crc(ch.subarray(4,17)));
  const i=33; // tras la firma (8) y el bloque IHDR (25)
  return new Blob([u.subarray(0,i),ch,u.subarray(i)],{type:"image/png"});
}
// JPG con la resolución anotada a 200 ppp (Photoshop lo abre a 32 × 45 cm)
async function jpgA200(cv){
  const u=new Uint8Array(await (await aBlob(cv,"image/jpeg",.95)).arrayBuffer());
  const jfif=[0xFF,0xE0,0,16,0x4A,0x46,0x49,0x46,0,1,1,1,0,200,0,200,0,0];
  if(u[2]===0xFF&&u[3]===0xE0&&u[6]===0x4A){ const c=u.slice(); c[13]=1; c[14]=0; c[15]=200; c[16]=0; c[17]=200; return new Blob([c],{type:"image/jpeg"}); }
  return new Blob([u.subarray(0,2),new Uint8Array(jfif),u.subarray(2)],{type:"image/jpeg"});
}

async function pdfDe(cv,wc,hc,pc,pa){
  wc=wc||WC; hc=hc||HC; pc=pc||wc; pa=pa||hc;

  push("%PDF-1.4\n");
  offs[1]=pos; push("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n");
  offs[2]=pos; push("2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n");
  offs[3]=pos; push("3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+Pw+" "+Ph+"]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n");
  offs[4]=pos; push("4 0 obj<</Type/XObject/Subtype/Image/Width "+cv.width+"/Height "+cv.height+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>stream\n"); push(jpg); push("\nendstream endobj\n");
  const c="q "+wpt+" 0 0 "+hpt+" "+ox+" "+oy+" cm /Im0 Do Q";
  offs[5]=pos; push("5 0 obj<</Length "+c.length+">>stream\n"+c+"\nendstream endobj\n");
  const xr=pos; let x="xref\n0 6\n0000000000 65535 f \n"; for(let i=1;i<=5;i++) x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(x+"trailer<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}

  enlazarComun();
  let gen=null;
  const onList=()=>{ const ok=$("#rev").checked&&!!gen; ["da3","dpng","dpdf"].forEach(k=>$("#"+k).disabled=!ok); };
  $("#rev").onchange=onList;
  componerTexto(p).then(r=>{ if(ruta().r!=="imprimir"||+ruta().id!==num) return; gen=r.cv; const v=$("#prev"); v.width=gen.width; v.height=gen.height; v.getContext("2d").drawImage(gen,0,0); v.style.display="block"; $("#estadoGen").style.display="none";
    const av=Object.keys(r.avisos); if(av.length) $("#avisoTx").innerHTML='<div class="warn">⚠ Algún texto es muy largo y la letra queda pequeña ('+esc(av.map(k=>(dz.campos.find(c=>c.id===k)||{}).etiqueta||k).join(", "))+').</div>'; onList(); })
   .catch(e=>{ const s=$("#estadoGen"); if(s){ s.style.color="#B42318"; s.textContent="No se pudo generar: "+e.message; } });
  const nom=(p.producto||"diseno")+"_"+num;
  $("#dpng").onclick=async()=>descargar(await pngA200(gen),nom+".png");
  $("#dpdf").onclick=async()=>descargar(await pdfDe(gen,dz.cm,dz.cm),nom+".pdf");
  $("#da3").onclick=async()=>{ descargar(await pdfDe(gen,dz.cm,dz.cm,29.7,42),nom+"_A3.pdf"); setTimeout(()=>{ if(p.situacion!=="imp"&&p.situacion!=="ent"&&confirm("¿Lo marco como Impreso? Pulsa Aceptar cuando lo hayas impreso.")) guardarCambios(p,{situacion:"imp"}); },800); };
}
function pintarImprimir(num){
  const p=pedidos.find(x=>x.numero===num);
  if(p&&esTexto(p)) return pintarImprimirTexto(p);
  if(!p||!p.datos||!p.datos.disposicion){ root.innerHTML=barra("")+'<main><a class="back" href="#/">'+I.back+'Pedidos</a>'+(estado()||'<div class="empty">No se puede generar este pedido.</div>')+'</main>'; enlazarComun(); return; }
  const d=p.datos, dis=d.disposicion, z=dis.zona_cm, area=z.w*z.h;
  const filas=dis.fotos.map(f=>({n:f.archivo,a:Math.round(f.w*f.h/area*100),ppp:f.ppp}));
  const baja=filas.filter(f=>f.ppp<150);
  const rech=Object.keys(p.fotos_ok||{}).filter(k=>p.fotos_ok[k]==="no");
  root.innerHTML=barra("")+'<main><div class="top"><div><h1>Vista previa del calendario</h1><p class="sub">Compruébalo con calma. No se imprime nada hasta que lo confirmes.</p></div><a class="back" href="#/pedido/'+p.numero+'">'+I.back+'Volver a la ficha</a></div>'+
   '<div class="big"><div><div id="estadoGen" class="empty" style="padding:60px 0">Preparando el calendario a máxima calidad…</div><canvas id="prev" style="display:none"></canvas><div class="sm" style="margin-top:8px">32 × 45 cm · 200 ppp · diseño '+esc(MODELOS[p.modelo]||p.modelo||"Único")+' · sin sangrado</div></div>'+
   '<div class="col"><section class="card"><h2>Pedido '+p.numero+' · '+esc(d.nombre)+'</h2><div class="kv"><span>Producto</span><span>'+esc(PRODUCTOS[p.producto].nombre)+'</span></div><div class="kv"><span>Diseño</span><span>'+esc(MODELOS[p.modelo]||p.modelo||"Único")+'</span></div><div class="kv"><span>Año</span><span>'+p.anio+'</span></div><div class="kv"><span>Fotos</span><span>'+dis.fotos.length+'</span></div></section>'+
   '<section class="card"><h2>Calidad de cada foto al imprimir</h2><div class="q" style="font-size:12px;font-weight:700;color:#5B6472"><span>Foto</span><span>% zona</span><span>Resolución</span></div>'+filas.map(f=>'<div class="q"><span>'+esc(f.n)+'</span><span>'+f.a+' %</span><span style="'+(f.ppp<150?"color:#7A4B00;font-weight:700":"")+'">'+f.ppp+' ppp</span></div>').join("")+
   (baja.length?'<div class="warn">⚠ '+(baja.length===1?"Una foto sale":baja.length+" fotos salen")+' por debajo de 150 ppp y puede verse pixelada. Pídele al cliente otra o acepta el resultado.</div>':"")+
   (rech.length?'<div class="warn">⚠ Has rechazado '+rech.length+' foto'+(rech.length>1?"s":"")+' de este pedido ('+esc(rech.join(", "))+').</div>':"")+'</section>'+
   '<section class="card"><h2>Confirmar impresión</h2><label style="display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin:0 0 12px"><input id="rev" type="checkbox" style="width:20px;height:20px;flex:none;margin-top:1px"><span>He revisado la vista previa y quiero imprimirla.</span></label>'+
   '<button class="b pri" id="imprimir" disabled>'+I.print+'Imprimir</button><button class="b pri" id="imprsra" disabled style="margin-top:8px">'+I.print+'Imprimir en la SRA3</button><div style="display:flex;gap:8px;margin-top:10px"><button class="b" id="dpng" disabled style="flex:1">Descargar PNG</button><button class="b" id="dpdf" disabled style="flex:1">Descargar PDF</button></div>'+
   '<p class="sm" style="margin:10px 0 0">Se abrirá el cuadro de impresión de este equipo. Después te preguntaré si lo marco como impreso.</p></section></div></div></main>';
  enlazarComun();
  const onList=()=>{ const ok=$("#rev").checked&&generado&&generado.num===num; ["imprimir","imprsra","dpng","dpdf"].forEach(id=>$("#"+id).disabled=!ok); };
  $("#rev").onchange=onList;
  const mostrar=cv=>{ const v=$("#prev"); v.width=cv.width; v.height=cv.height; v.getContext("2d").drawImage(cv,0,0); v.style.display="block"; $("#estadoGen").style.display="none"; onList(); };
  if(generado&&generado.num===num) mostrar(generado.canvas);
  else componerFinal(p).then(cv=>{ generado={num,canvas:cv}; if(ruta().r==="imprimir"&&ruta().id==num) mostrar(cv); }).catch(e=>{ const s=$("#estadoGen"); if(s) { s.style.color="#B42318"; s.textContent="No se pudo generar: "+e.message; } });
  $("#dpng").onclick=async()=>descargar(await pngA200(generado.canvas),"calendario_"+p.numero+".png");
  $("#dpdf").onclick=async()=>descargar(await pdfDe(generado.canvas),"calendario_"+p.numero+".pdf");
  $("#imprsra").onclick=async()=>{
    if(!confirm("Se enviará 1 copia del pedido "+p.numero+" a la impresora SRA3. ¿Continuar?")) return;
    const bt=$("#imprsra"), txt=bt.innerHTML; bt.disabled=true; bt.textContent="Enviando a la impresora…";
    try{
      const st=await asegurarImpresor();
      if(!st.predeterminada_ok) throw new Error("La impresora predeterminada de Windows es '"+st.predeterminada+"' y debe ser '"+st.impresora+"'. No se ha imprimido nada.");
      const r=await fetch(IMPRESOR+"/imprimir?pedido="+p.numero,{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:await jpgA200(generado.canvas)});
      const j=await r.json().catch(()=>({ok:false,error:"Respuesta no válida del impresor."}));
      if(!j.ok) throw new Error(j.error||"Error al imprimir.");
      aviso("Enviado a la impresora. Mira en Command WorkStation que ha llegado el trabajo.");
      setTimeout(()=>{ if(p.situacion!=="imp"&&p.situacion!=="ent"&&confirm("¿Ha llegado el pedido "+p.numero+" a Command WorkStation? Pulsa Aceptar para marcarlo como Impreso.")) guardarCambios(p,{situacion:"imp"}); },600);
    }catch(e){ alert(e.message&&/fetch|Failed|Network/i.test(e.message)?"No se pudo hablar con el impresor del PC.":e.message); }
    bt.innerHTML=txt; onList();
  };
  $("#imprimir").onclick=async()=>{
    const blob=await pngA200(generado.canvas), u=URL.createObjectURL(blob), w=window.open("","_blank");
    if(!w){ aviso("El navegador ha bloqueado la ventana. Permite las ventanas emergentes para esta página."); return; }
    w.document.write('<!doctype html><title>Pedido '+p.numero+'</title><style>@page{size:'+WC*10+'mm '+HC*10+'mm;margin:0}html,body{margin:0}img{display:block;width:'+WC*10+'mm;height:'+HC*10+'mm}</style><img src="'+u+'">');
    w.document.close(); const im=w.document.querySelector("img"); im.onload=()=>{ w.focus(); w.print(); };
    w.onafterprint=()=>setTimeout(()=>{ if(p.situacion!=="imp"&&p.situacion!=="ent"&&confirm("¿Has impreso el pedido "+p.numero+"? Pulsa Aceptar para marcarlo como Impreso.")) guardarCambios(p,{situacion:"imp"}); },400);
  };
}

window.addEventListener("hashchange",()=>{ pintar(); window.scrollTo(0,0); });
if(ses) cargar(); else pintar();
})();
</script>
